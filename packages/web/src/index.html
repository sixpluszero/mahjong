<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1565c0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="四川麻将" />
    <title>四川麻将调试客户端</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page">
      <h1>四川麻将（本地调试）</h1>

      <section class="panel">
        <h2>连接与房间</h2>
        <div class="row">
          <label>昵称</label>
          <input id="nameInput" placeholder="例如 玩家A" maxlength="20" />
          <button id="randomNameBtn" type="button">随机昵称</button>
          <button id="helloBtn" type="button">确认昵称</button>
        </div>

        <div class="row">
          <button id="createRoomBtn" type="button">创建房间</button>
          <input id="roomIdInput" placeholder="输入房间号加入" maxlength="6" />
          <button id="joinRoomBtn" type="button">加入房间</button>
          <button id="addBotBtn" type="button">添加机器人</button>
          <button id="readyBtn" type="button">准备</button>
        </div>

        <div id="status"></div>
        <div class="row">
          <button id="reconnectBtn" type="button">重新连接</button>
        </div>
        <div id="diag"></div>
        <div id="roomInfo"></div>
        <div class="row">
          <button id="refreshRoomsBtn" type="button">刷新活跃房间</button>
        </div>
        <div id="activeRooms"></div>
        <div id="players"></div>
        <h3>总分榜</h3>
        <div id="totals"></div>
        <h3>历史战绩（最近 10 局）</h3>
        <pre id="history"></pre>
        <h3>分数走势</h3>
        <pre id="trend"></pre>
        <h3>动态排行榜（按总分实时）</h3>
        <pre id="finalStats"></pre>
      </section>

      <section class="panel game-panel">
        <h2>对局</h2>
        <div id="gameInfo"></div>
        <div id="actionBar"></div>

        <h3>你的手牌（点击可打出）</h3>
        <div id="hand"></div>

        <h3>你的碰杠</h3>
        <div id="melds"></div>

        <h3>弃牌堆（最近在前）</h3>
        <div id="discards"></div>

        <h3>结算事件（最近 10 条）</h3>
        <div id="events"></div>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
